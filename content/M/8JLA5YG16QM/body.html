<section id="s1" data-toc="背景"><h2>1. Game & Watch 与《大乱斗》 <a class="ts" href="https://youtu.be/8JLA5YG16QM?t=6" target="_blank" rel="noopener">0:06</a></h2>
<p>Game & Watch 是任天堂 1980 年起发售的 LSI 游戏系列。开发《大乱斗》时，樱井拿到了宝贵的液晶图案资料。</p>
<div class="row"><figure><img src="img/f110.webp" alt="" loading="lazy"><figcaption>Game & Watch（0:11 左右）</figcaption></figure><figure><img src="img/f220.webp" alt="" loading="lazy"><figcaption>《特别版》的平面世界 X（0:22 左右）</figcaption></figure></div>
<p>这次经任天堂特别许可，展示其中一些图案。</p>
</section>
<section id="s2" data-toc="原理"><h2>2. 液晶图案的原理 <a class="ts" href="https://youtu.be/8JLA5YG16QM?t=33" target="_blank" rel="noopener">0:33</a></h2>
<div class="key">G&W 的每个图案都在液晶上的固定位置，靠点亮/熄灭来表现动作。所以角色所有姿势、所有位置的图都同时印在一块液晶上，并要互不重叠地排布。</div>
<div class="row"><figure><img src="img/f440.webp" alt="" loading="lazy"><figcaption>《Fire》（1980）全图案（0:44 左右）</figcaption></figure><figure><img src="img/f550.webp" alt="" loading="lazy"><figcaption>《Ball》（1980）（0:55 左右）</figcaption></figure></div>
</section>
