<section id="s1" data-toc="演示就是速度"><h2>1. 演示就是速度 <a class="ts" href="https://youtu.be/nkNSNGJvFXk?t=0" target="_blank" rel="noopener">0:00</a></h2>
<div class="row">
<div>
<p>团队协作做东西，就一定需要把想法 present 给别人；即便不是团队，创作者向别人传达东西也很重要。樱井（自称被认为比较擅长演示）的「秘诀」只有一条：</p>
<blockquote><b>演示就是速度。</b></blockquote>
<ul class="points">
<li>削掉赘肉，只传达必要的内容。</li>
<li>不需要（冗长的）用意说明和各种附加。</li>
<li>需要配图，但要<b>简洁</b>。</li>
<li>不一定要「短」——关键是在给定时间里讲得多<b>密</b>、节奏多<b>快</b>。</li>
</ul>
<p>他用这期本身示范：「我的演示到此结束。讲得短，所以印象深吧？」</p>
</div>

</div>
